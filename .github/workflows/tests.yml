name: Tests and audit database
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx supabase --version
